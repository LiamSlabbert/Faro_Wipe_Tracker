<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Faro Device Wipe Tracker</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --card: #fff;
        --ink: #1d1d1f;
        --mut: #6e6e73;
        --line: #e5e5ea;
        --fill: #f0f0f4;
        --pri: #0071e3;
        --pri-h: #0077ed;
        --ok: #248a3d;
        --okbg: #e8f5ec;
        --err: #d70015;
        --errbg: #fdecee;
        --warn: #8a5a00;
        --warnbg: #fff6e0;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 24px rgba(0, 0, 0, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          18px/1.45 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid var(--line);
        padding: 14px 32px;
        display: flex;
        align-items: center;
      }
      header b {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-right: auto;
      }
      #who {
        font-size: 16px;
        color: var(--mut);
      }
      #who a {
        color: var(--pri);
        margin-left: 8px;
        text-decoration: none;
        font-weight: 500;
      }
      main {
        max-width: 860px;
        margin: 36px auto;
        padding: 0 24px;
      }
      main.wide {
        max-width: 2000px;
      }
      .card {
        background: var(--card);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 32px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.022em;
      }
      h2 {
        margin: 0 0 16px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .mut {
        color: var(--mut);
      }
      a {
        color: var(--pri);
        text-decoration: none;
        font-weight: 500;
        font-size: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 16px;
        margin: 22px 0 8px;
      }
      input[type="text"],
      textarea,
      select,
      input[type="date"] {
        width: 100%;
        font-size: 28px;
        padding: 14px 18px;
        border: 1.5px solid #d2d2d7;
        border-radius: 14px;
        background-color: var(--fill);
        color: var(--ink);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        transition:
          box-shadow 0.15s,
          border-color 0.15s,
          background 0.15s;
      }
      input[type="text"],
      textarea {
        -webkit-appearance: none;
        appearance: none;
        box-shadow: none;
      }
      select,
      input[type="date"] {
        font-family: inherit;
        font-size: 17px;
        padding: 11px 14px;
        width: auto;
      }
      textarea {
        font-size: 19px;
        font-family: inherit;
        min-height: 110px;
      }
      input.txt {
        font-family: inherit;
        font-size: 22px;
      }
      input[type="text"].search {
        font-family: inherit;
        font-size: 17px;
        padding: 11px 14px;
        width: 280px;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        background: #fff;
        border-color: var(--pri);
        box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.18);
      }
      .msg {
        margin-top: 10px;
        padding: 11px 16px;
        border-radius: 12px;
        font-size: 16px;
      }
      .e {
        background: var(--errbg);
        color: var(--err);
      }
      .g {
        background: var(--okbg);
        color: var(--ok);
      }
      .w {
        background: var(--warnbg);
        color: var(--warn);
      }
      button.btn {
        font-weight: 600;
        font-size: 19px;
        line-height: 1;
        font-family: inherit;
        padding: 17px 30px;
        border: 0;
        border-radius: 980px;
        background: var(--pri);
        color: #fff;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.05s;
      }
      button.btn:hover:not(:disabled) {
        background: var(--pri-h);
      }
      button.btn:active:not(:disabled) {
        transform: scale(0.98);
      }
      button.btn:disabled {
        background: #e3e3e8;
        color: #a1a1a6;
        cursor: not-allowed;
      }
      button.btn.ok {
        background: var(--ok);
      }
      button.btn.ok:disabled {
        background: #e3e3e8;
      }
      button.btn.sec {
        background: #ececf0;
        color: var(--ink);
        font-size: 16px;
        padding: 12px 20px;
      }
      button.btn.sec:hover:not(:disabled) {
        background: #e3e3e8;
      }
      button.btn.dng {
        background: var(--errbg);
        color: var(--err);
        font-size: 16px;
        padding: 12px 20px;
      }
      button.btn.dng:hover:not(:disabled) {
        background: #fbd9dd;
      }
      button.btn.dng:disabled {
        background: #f0f0f3;
        color: #b0b0b5;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
        margin-top: 28px;
      }
      .prog {
        display: flex;
        gap: 8px;
        margin-bottom: 26px;
      }
      .prog div {
        flex: 1;
        padding: 10px 6px;
        text-align: center;
        border-radius: 12px;
        background: #ececf0;
        color: var(--mut);
        font-size: 14px;
        font-weight: 600;
      }
      .prog .done {
        background: var(--okbg);
        color: var(--ok);
      }
      .prog .act {
        background: var(--pri);
        color: #fff;
      }
      .dev {
        font:
          600 15px ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: var(--pri);
        background: rgba(0, 113, 227, 0.1);
        padding: 5px 12px;
        border-radius: 99px;
      }
      .big {
        font:
          600 34px ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        background: var(--fill);
        padding: 14px 20px;
        border-radius: 14px;
        letter-spacing: 1.5px;
        word-break: break-all;
      }
      .chk {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 18px 20px;
        border: 1.5px solid var(--line);
        border-radius: 16px;
        margin-top: 12px;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .chk input {
        width: 28px;
        height: 28px;
        accent-color: var(--ok);
      }
      .chk.on {
        border-color: var(--ok);
        background: var(--okbg);
      }
      .sum {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
      }
      .sum div {
        flex: 1;
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 20px 24px;
        font-size: 15px;
        color: var(--mut);
      }
      .sum b {
        display: block;
        font-size: 42px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 16px;
      }
      th,
      td {
        text-align: left;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
        white-space: nowrap;
      }
      .tablewrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      th {
        color: var(--mut);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.m {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .tag {
        padding: 4px 12px;
        border-radius: 99px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      .Completed {
        background: var(--okbg);
        color: var(--ok);
      }
      .Exception {
        background: var(--errbg);
        color: var(--err);
      }
      .In-Progress {
        background: var(--warnbg);
        color: var(--warn);
      }
      .QC-Failed {
        background: #f3e8fd;
        color: #7a2fb5;
      }
      .opts {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .opt {
        flex: 1;
        min-width: 130px;
        padding: 16px 20px;
        border: 1.5px solid var(--line);
        border-radius: 16px;
        background: #fff;
        font-size: 20px;
        font-weight: 600;
        font-family: inherit;
        color: var(--ink);
        text-align: center;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .opt:hover {
        background: var(--fill);
      }
      .opt.on {
        border-color: var(--pri);
        background: rgba(0, 113, 227, 0.08);
        color: var(--pri);
      }
      .opt.bad.on {
        border-color: var(--err);
        background: var(--errbg);
        color: var(--err);
      }
      .icon-btn {
        background: var(--fill);
        border: 0;
        border-radius: 10px;
        padding: 9px;
        cursor: pointer;
        color: var(--ink);
        line-height: 0;
        margin-left: 6px;
        transition: background 0.15s;
      }
      .icon-btn:hover {
        background: #e3e3e8;
      }
      .icon-btn.del {
        color: var(--err);
      }
      .icon-btn.del:hover {
        background: var(--errbg);
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9;
        padding: 20px;
        overflow-y: auto;
      }
      .modal .card {
        width: 560px;
        max-width: 100%;
        margin: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      .toast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(29, 29, 31, 0.92);
        color: #fff;
        padding: 14px 26px;
        border-radius: 99px;
        font-weight: 600;
        font-size: 16px;
        z-index: 10;
      }
      #report {
        display: none;
      }
      @media print {
        body > *:not(#report) {
          display: none !important;
        }
        #report {
          display: block;
          font-size: 12px;
          background: #fff;
          font-family: Arial, Helvetica, sans-serif;
          text-rendering: geometricPrecision;
          -webkit-font-smoothing: antialiased;
        }
        #report table {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <header><b>📱 Faro Device Wipe Tracker</b><span id="who"></span></header>
    <main id="app"></main>
    <div id="report"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script>
      "use strict";

      /* ============================================================
   Configuration
   ============================================================ */
      const STORAGE_KEY = "iphone-processing-v2";
      const IMEI_LENGTH = 15;
      const STATE_VERSION = 2; // bumped when the saved data layout changes
      const STORAGE_OPTIONS = ["64GB", "128GB", "256GB", "512GB", "1TB"];
      const STATUS = {
        IN_PROGRESS: "In Progress",
        COMPLETED: "Completed",
        EXCEPTION: "Exception",
        QC_FAILED: "QC Failed",
      };
      const STEP_LABELS = [
        "Identify",
        "PhoneCheck",
        "Physical QC",
        "Wipe",
        "Power off",
        "Verify",
      ];
      const QC_GRADES = ["A", "B", "C"];
      const QC_BATTERY_OPTIONS = ["Normal", "Overheating"];
      const QC_GRADE_LABELS = { A: "Excellent", B: "Good", C: "Poor" };
      const QC_PHONECHECK_OPTIONS = ["Pass", "Fail"];
      // Reasons for failing Physical QC (PhoneCheck failures have their own notes).
      const QC_FAIL_REASONS = [
        "Overheating battery",
        "Cracked or damaged screen",
        "Low battery health",
        "Heavy cosmetic damage",
        "iCloud / MDM locked",
        "Other",
      ];
      // Suggestions only: other models can still be typed in.
      const MODEL_OPTIONS = [
        "iPhone 8",
        "iPhone 8 Plus",
        "iPhone X",
        "iPhone XR",
        "iPhone XS",
        "iPhone XS Max",
        "iPhone SE (2nd Gen)",
        "iPhone SE (3rd Gen)",
        "iPhone 11",
        "iPhone 11 Pro",
        "iPhone 11 Pro Max",
        "iPhone 12 mini",
        "iPhone 12",
        "iPhone 12 Pro",
        "iPhone 12 Pro Max",
        "iPhone 13 mini",
        "iPhone 13",
        "iPhone 13 Pro",
        "iPhone 13 Pro Max",
        "iPhone 14",
        "iPhone 14 Plus",
        "iPhone 14 Pro",
        "iPhone 14 Pro Max",
        "iPhone 15",
        "iPhone 15 Plus",
        "iPhone 15 Pro",
        "iPhone 15 Pro Max",
        "iPhone 16e",
        "iPhone 16",
        "iPhone 16 Plus",
        "iPhone 16 Pro",
        "iPhone 16 Pro Max",
        "iPhone 17",
        "iPhone Air",
        "iPhone 17 Pro",
        "iPhone 17 Pro Max",
      ];
      const VERIFY_CHECKS = [
        { key: "imei", label: "IMEI matches the device" },
        { key: "ser", label: "Serial Number matches the device" },
        { key: "enr", label: "ENROLLED & CHECKED" },
      ];
      const SVG_ATTRS =
        'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
      const ICONS = {
        edit: `<svg ${SVG_ATTRS}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
        trash: `<svg ${SVG_ATTRS}><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>`,
      };

      /* ============================================================
   Storage layer
   To add a backend later, replace load() and save() with API calls.
   ============================================================ */
      const storage = {
        load() {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY));
          } catch (error) {
            return null;
          }
        },
        save(appState) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          } catch (error) {
            alert("Could not save data in this browser!");
          }
        },
      };

      /* ============================================================
   State
   Saved data: { operator, records }
   A record:   { imei, serial, brand, model, storage, operator, date, status, note, step, chk,
                 qcPhonecheck, pcNote, qcResult, qcGrade, qcBattery, qcNote, qcReason }
   (chk holds the verify-step ticks: { imei, ser, enr })
   (PhoneCheck and Physical QC are separate: qcPhonecheck is "Pass" or "Fail" and pcNote says
    which test failed. qcResult is the Physical QC result ("Pass" or "Fail", empty if never
    reached); qcGrade is A/B/C; qcBattery is Normal/Overheating; qcReason/qcNote say why
    Physical QC failed. Either kind of failure gives the device the status "QC Failed".)
   Devices have no ID of their own: they are identified by IMEI / Serial.
   ============================================================ */
      let state = loadState();

      // Screen state that does not need to survive a refresh.
      const ui = {
        screen: "home", // 'home' or 'device'
        changingName: false,
        date: todayString(),
        statusFilter: "",
        search: "",
        serialTouched: false,
        duplicateAcknowledged: false,
        editing: null, // the record open in the edit window
        deleting: null, // the record waiting to be deleted
      };

      function loadState() {
        const saved = storage.load();
        if (saved && Array.isArray(saved.records)) {
          const oldVersion = saved.version || 1;
          saved.records.forEach((device) => {
            // The status used to be called "Physical QC Failed".
            if (device.status === "Physical QC Failed")
              device.status = STATUS.QC_FAILED;
            // Records saved before QC existed: add the QC fields.
            if (device.qcResult === undefined) {
              device.qcResult = "";
              device.qcGrade = "";
              device.qcBattery = "";
              device.qcNote = "";
              // A device already part-way through must now do QC before it is wiped.
              if (device.status === STATUS.IN_PROGRESS && device.step > 2)
                device.step = 2;
            }
            // Records saved before PhoneCheck result and fail reason existed.
            if (device.qcPhonecheck === undefined) {
              device.qcPhonecheck = "";
              device.qcReason = "";
            }
            if (device.pcNote === undefined) device.pcNote = "";
            if (oldVersion < 2) {
              // PhoneCheck is now its own step (2), so the later steps moved up by one.
              if (device.status === STATUS.IN_PROGRESS && device.step >= 3)
                device.step += 1;
              // A PhoneCheck failure used to count as a Physical QC failure too. Now it doesn't.
              if (device.qcPhonecheck === "Fail") {
                device.pcNote = [
                  device.qcReason === "PhoneCheck test failed"
                    ? ""
                    : device.qcReason,
                  (device.qcNote || "").trim(),
                ]
                  .filter(Boolean)
                  .join(" - ");
                device.qcResult = "";
                device.qcReason = "";
                device.qcNote = "";
              }
            }
          });
          saved.version = STATE_VERSION;
          return saved;
        }
        return { operator: null, version: STATE_VERSION, records: [] };
      }

      function persist() {
        storage.save(state);
      }

      /* ============================================================
   Helpers
   ============================================================ */
      const $ = (id) => document.getElementById(id);
      function pad2(number) {
        return String(number).padStart(2, "0");
      }

      function todayString() {
        const now = new Date();
        return `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
      }

      function escapeHtml(text) {
        const replacements = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
        };
        return String(text ?? "").replace(
          /[&<>"]/g,
          (char) => replacements[char],
        );
      }

      const statusClass = (status) => status.replace(/\s+/g, "-");
      const countByStatus = (devices, status) =>
        devices.filter((device) => device.status === status).length;

      function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      }

      function openModal(contentHtml) {
        closeModal();
        const modal = document.createElement("div");
        modal.className = "modal";
        modal.id = "modal";
        modal.innerHTML = `<div class="card">${contentHtml}</div>`;
        document.body.appendChild(modal);
      }

      function closeModal() {
        const modal = $("modal");
        if (modal) modal.remove();
      }

      function storageDatalistHtml() {
        return `<datalist id="storage-options">${STORAGE_OPTIONS.map((option) => `<option value="${option}">`).join("")}</datalist>`;
      }

      /* ============================================================
   Device data functions
   ============================================================ */
      function createDevice() {
        const device = {
          imei: "",
          serial: "",
          brand: "",
          model: "",
          storage: "",
          operator: state.operator,
          date: todayString(),
          status: STATUS.IN_PROGRESS,
          note: "",
          step: 1,
          chk: {},
          qcResult: "",
          qcGrade: "",
          qcBattery: "",
          qcNote: "",
          qcPhonecheck: "",
          pcNote: "",
          qcReason: "",
        };
        state.records.push(device);
        persist();
        return device;
      }

      function findOpenDevice() {
        return state.records.find(
          (device) =>
            device.status === STATUS.IN_PROGRESS &&
            device.operator === state.operator,
        );
      }

      // Rows in the list point at a record by its position in state.records.
      function deviceAtIndex(index) {
        return state.records[Number(index)];
      }

      function isBlankDevice(device) {
        return (
          device.status === STATUS.IN_PROGRESS &&
          !device.imei &&
          !device.serial &&
          !device.brand &&
          !device.model &&
          !device.storage
        );
      }

      // Drops empty devices (nothing typed).
      function removeBlankDevices() {
        state.records = state.records.filter(
          (device) => !isBlankDevice(device),
        );
      }

      function devicesForSelectedDay() {
        return state.records.filter(
          (device) =>
            device.date === ui.date && device.operator === state.operator,
        );
      }

      // Exports skip blank placeholder devices.
      function devicesForExport() {
        return devicesForSelectedDay().filter(
          (device) => !isBlankDevice(device),
        );
      }

      function findDuplicate(device) {
        return state.records.find(
          (other) => other !== device && other.imei === device.imei,
        );
      }

      // How a device is named on screen: by its IMEI, or its Serial if there is no IMEI yet.
      function deviceLabel(device) {
        return device.imei || device.serial || "Device";
      }

      function hasText(value) {
        return (value || "").trim() !== "";
      }

      function isIdentified(device) {
        return (
          device.imei.length === IMEI_LENGTH &&
          hasText(device.serial) &&
          hasText(device.brand) &&
          hasText(device.model) &&
          hasText(device.storage)
        );
      }

      function canPassQc(device) {
        return device.qcBattery === "Normal" && hasText(device.qcGrade);
      }

      // Failing needs a reason; "Other" also needs a note saying what it was.
      function canFailQc(device) {
        if (!hasText(device.qcReason)) return false;
        return device.qcReason !== "Other" || hasText(device.qcNote);
      }

      // Note shown in lists and reports: the exception note, or why a device failed QC
      // (a PhoneCheck failure or a Physical QC failure).
      function noteText(device) {
        if (device.note) return device.note;
        if (device.status === STATUS.QC_FAILED) {
          if (device.qcPhonecheck === "Fail")
            return ["PhoneCheck failed", (device.pcNote || "").trim()]
              .filter(Boolean)
              .join(" - ");
          return [device.qcReason, (device.qcNote || "").trim()]
            .filter(Boolean)
            .join(" - ");
        }
        return "";
      }

      // Fixes capitalisation and spacing, e.g. "iphone13pro" -> "iPhone 13 Pro".
      function canonicalModel(text) {
        const squash = (value) => value.toLowerCase().replace(/[\s()]/g, "");
        const typed = text.trim().replace(/\s+/g, " ");
        const match = MODEL_OPTIONS.find(
          (model) => squash(model) === squash(typed),
        );
        return match || typed;
      }

      function modelDatalistHtml() {
        return `<datalist id="model-options">${MODEL_OPTIONS.map((model) => `<option value="${model}">`).join("")}</datalist>`;
      }

      function isFullyVerified(device) {
        return VERIFY_CHECKS.every((check) => device.chk[check.key]);
      }

      function finishDevice(device, status, note = "") {
        device.status = status;
        device.note = note;
        device.date = todayString();
        persist();
        closeModal();
        showToast(
          status === STATUS.COMPLETED
            ? `${deviceLabel(device)} completed ✓`
            : status === STATUS.QC_FAILED
              ? `${deviceLabel(device)} marked QC Failed`
              : `${deviceLabel(device)} saved as exception`,
        );
        ui.screen = "home";
        render();
      }

      /* ============================================================
   Rendering
   ============================================================ */
      function render() {
        $("who").innerHTML = state.operator
          ? `${escapeHtml(state.operator)} · <a href="#" data-action="changeName">change</a>`
          : "";

        if (!state.operator || ui.changingName) return renderNameScreen();
        if (ui.screen === "device") return renderDeviceScreen();
        renderHomeScreen();
      }

      function renderNameScreen() {
        const currentName = state.operator || "";
        $("app").className = "";
        $("app").innerHTML = `
    <div class="card">
      ${currentName ? '<button class="btn sec" data-action="cancelChangeName">← Back</button>' : ""}
      <h1 style="margin-top:${currentName ? 16 : 0}px">Who is working?</h1>
      <p class="mut">${currentName ? "Changing your name updates it on all of your existing devices." : "Your name is saved on every device you process."}</p>
      <label>Enter your name</label>
      <input type="text" id="name-input" style="font-family:inherit" value="${escapeHtml(currentName)}"
             placeholder="e.g. Liam" autocomplete="off">
      <div class="row">
        <span></span>
        <button class="btn" id="start-button" data-action="startSession" ${currentName ? "" : "disabled"}>${currentName ? "Save name →" : "Start session →"}</button>
      </div>
    </div>`;
        const input = $("name-input");
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }

      function renderHomeScreen() {
        const devices = devicesForSelectedDay();
        const openDevice = findOpenDevice();

        const mainButton = openDevice
          ? `<button class="btn" data-action="resumeDevice">▶ Resume current device</button>`
          : '<button class="btn" data-action="addDevice">＋ Add new device</button>';

        const statusOptions = Object.values(STATUS)
          .map(
            (status) =>
              `<option ${ui.statusFilter === status ? "selected" : ""}>${status}</option>`,
          )
          .join("");

        $("app").className = "wide";
        $("app").innerHTML = `
    <div class="row" style="margin:0 0 18px">
      <h1 style="font-size:30px">${escapeHtml(state.operator)} — my devices</h1>
      ${mainButton}
    </div>
    <div class="sum">
      <div><b>${countByStatus(devices, STATUS.COMPLETED)}</b>Completed</div>
      <div><b style="color:#7a2fb5">${countByStatus(devices, STATUS.QC_FAILED)}</b>QC Failed</div>
      <div><b style="color:var(--err)">${countByStatus(devices, STATUS.EXCEPTION)}</b>Exceptions</div>
      <div><b>${countByStatus(devices, STATUS.IN_PROGRESS)}</b>In Progress</div>
    </div>
    <div class="card">
      <div class="row" style="margin:0 0 16px">
        <div>
          <input type="date" data-filter="date" value="${ui.date}">
          <select data-filter="status"><option value="">All statuses</option>${statusOptions}</select>
          <input type="text" class="search" id="search-input" placeholder="Search IMEI, serial, model…" value="${escapeHtml(ui.search)}" autocomplete="off">
        </div>
        <div>
          <button class="btn sec" data-action="exportCsv">Export CSV</button>
          <button class="btn sec" data-action="exportPdf">Export PDF report</button>
        </div>
      </div>
      <div class="tablewrap">
      <table>
        <thead><tr><th>IMEI</th><th>Serial</th><th>Brand</th><th>Model</th><th>Storage</th><th>PhoneCheck</th><th>Physical QC</th><th>Status</th><th>Note</th><th></th></tr></thead>
        <tbody id="device-rows">${deviceRowsHtml()}</tbody>
      </table>
      </div>
      <div class="row">
        <span></span>
        <button class="btn dng" data-action="clearAllData">Clear all data</button>
      </div>
    </div>`;
      }

      function matchesSearch(device) {
        const query = ui.search.trim().toLowerCase();
        if (!query) return true;
        return [
          device.imei,
          device.serial,
          device.brand,
          device.model,
          device.storage,
          device.status,
          device.qcResult,
          device.qcGrade,
          device.qcBattery,
          device.qcNote,
          device.qcReason,
          device.qcPhonecheck,
          device.pcNote,
          device.note,
        ]
          .join(" ")
          .toLowerCase()
          .includes(query);
      }

      function deviceRowsHtml() {
        const devices = devicesForSelectedDay();
        // Newest first: records are stored in the order they were added.
        const visible = devices
          .filter(
            (device) => !ui.statusFilter || device.status === ui.statusFilter,
          )
          .filter(matchesSearch)
          .reverse();
        if (visible.length) return visible.map(deviceRowHtml).join("");
        const message = devices.length
          ? "No devices match your search or filter."
          : "No devices yet. Press “Add new device” to start.";
        return `<tr><td colspan="10" class="mut">${message}</td></tr>`;
      }

      function deviceRowHtml(device) {
        const index = state.records.indexOf(device);
        const firstButton =
          device.status === STATUS.IN_PROGRESS
            ? '<button class="btn sec" data-action="resumeDevice">Resume</button>'
            : `<button class="icon-btn" title="Edit" aria-label="Edit ${escapeHtml(deviceLabel(device))}" data-action="openEditModal" data-index="${index}">${ICONS.edit}</button>`;
        const rowButtons = `${firstButton}
    <button class="icon-btn del" title="Delete" aria-label="Delete ${escapeHtml(deviceLabel(device))}" data-action="openDeleteModal" data-index="${index}">${ICONS.trash}</button>`;
        return `
    <tr>
      <td class="m">${escapeHtml(device.imei) || "—"}</td>
      <td class="m">${escapeHtml(device.serial) || "—"}</td>
      <td>${escapeHtml(device.brand) || "—"}</td>
      <td>${escapeHtml(device.model) || "—"}</td>
      <td>${escapeHtml(device.storage) || "—"}</td>
      <td>${phonecheckCellHtml(device)}</td>
      <td>${qcCellHtml(device)}</td>
      <td><span class="tag ${statusClass(device.status)}">${device.status}</span></td>
      <td>${escapeHtml(noteText(device))}</td>
      <td style="white-space:nowrap">${rowButtons}</td>
    </tr>`;
      }

      function phonecheckCellHtml(device) {
        if (device.qcPhonecheck === "Pass")
          return '<span class="tag Completed">Pass</span>';
        if (device.qcPhonecheck === "Fail")
          return '<span class="tag QC-Failed">Fail</span>';
        return "—";
      }

      function qcCellHtml(device) {
        if (device.qcResult === "Pass")
          return `<span class="tag Completed">Pass</span> <b>${escapeHtml(device.qcGrade)}</b>`;
        if (device.qcResult === "Fail")
          return `<span class="tag QC-Failed">Fail</span>${device.qcGrade ? ` <b>${escapeHtml(device.qcGrade)}</b>` : ""}`;
        return "—";
      }

      function renderDeviceScreen() {
        const device = findOpenDevice();
        if (!device) {
          ui.screen = "home";
          return render();
        }

        const stepRenderers = {
          1: identifyStepHtml,
          2: phonecheckStepHtml,
          3: physicalQcStepHtml,
          4: wipeStepHtml,
          5: powerOffStepHtml,
          6: verifyStepHtml,
        };
        const progressBar = STEP_LABELS.map((label, index) => {
          const stepNumber = index + 1;
          const cssClass =
            stepNumber < device.step
              ? "done"
              : stepNumber === device.step
                ? "act"
                : "";
          const checkmark = stepNumber < device.step ? "✓ " : "";
          return `<div class="${cssClass}">${checkmark}${stepNumber} ${label}</div>`;
        }).join("");

        $("app").className = "";
        $("app").innerHTML = `
    <div class="card">
      <div class="row" style="margin:0 0 14px">
        <span class="dev">${escapeHtml(device.imei || device.serial) || "New device"}</span>
        <a href="#" data-action="backToList">← Back to my devices</a>
      </div>
      <div class="prog">${progressBar}</div>
      ${stepRenderers[device.step](device)}
    </div>
    <div style="text-align:right">
      <button class="btn dng" data-action="openExceptionModal">⚠ Mark as Exception</button>
    </div>`;

        if (device.step === 1) updateIdentifyForm();
        if (device.step === 3) updateQcForm();
      }

      function identifyStepHtml(device) {
        return `
    <h2>Enter the device identifiers</h2>
    <label>IMEI (15 digits)</label>
    <input type="text" id="imei-input" inputmode="numeric" maxlength="${IMEI_LENGTH}"
           value="${escapeHtml(device.imei)}" autocomplete="off">
    <div id="imei-message"></div>
    <label>Serial Number</label>
    <input type="text" id="serial-input" value="${escapeHtml(device.serial)}" autocomplete="off">
    <div id="serial-message"></div>
    <label>Brand</label>
    <input type="text" class="txt" id="brand-input" value="${escapeHtml(device.brand)}" placeholder="e.g. Apple" autocomplete="off">
    <label>Model</label>
    <input type="text" class="txt" id="model-input" list="model-options" value="${escapeHtml(device.model)}" placeholder="e.g. iPhone 13 Pro" autocomplete="off">
    ${modelDatalistHtml()}
    <label>Storage</label>
    <input type="text" class="txt" id="storage-input" list="storage-options" value="${escapeHtml(device.storage)}" placeholder="e.g. 128GB" autocomplete="off">
    ${storageDatalistHtml()}
    <div id="duplicate-warning"></div>
    <div class="row"><span></span><button class="btn" id="continue-button" data-action="confirmIdentifiers">Confirm identifiers →</button></div>`;
      }

      function optionButtonsHtml(
        field,
        options,
        selected,
        badValue = "",
        labels = {},
      ) {
        return `<div class="opts">${options
          .map((option) => {
            const text = labels[option]
              ? `${option} — ${labels[option]}`
              : option;
            return `<button type="button" class="opt ${option === selected ? "on" : ""} ${option === badValue ? "bad" : ""}" data-action="setQc" data-field="${field}" data-value="${option}">${option === "Overheating" ? "🔥 " : ""}${text}</button>`;
          })
          .join("")}</div>`;
      }

      function reasonOptionsHtml(selected) {
        return ['<option value="">Select a reason…</option>']
          .concat(
            QC_FAIL_REASONS.map(
              (reason) =>
                `<option ${reason === selected ? "selected" : ""}>${reason}</option>`,
            ),
          )
          .join("");
      }

      function phonecheckStepHtml(device) {
        const failed = device.qcPhonecheck === "Fail";
        return `
    <h2>PhoneCheck</h2>
    <p class="mut">Run PhoneCheck on the device, then enter its result.</p>
    <p><b>${escapeHtml(device.brand)} ${escapeHtml(device.model)}</b> · ${escapeHtml(device.storage)} · <span class="mut">${escapeHtml(device.imei)}</span></p>
    <label>PhoneCheck result</label>
    ${optionButtonsHtml("qcPhonecheck", QC_PHONECHECK_OPTIONS, device.qcPhonecheck, "Fail")}
    ${
      failed
        ? `<label>Which test failed? <span class="mut" style="font-weight:400">(optional)</span></label>
    <textarea id="pc-note" placeholder="e.g. Touch screen, Face ID">${escapeHtml(device.pcNote)}</textarea>`
        : ""
    }
    <div class="row">
      <button class="btn sec" data-action="goToStep" data-step="1">← Edit identifiers</button>
      <span style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn dng" data-action="failPhonecheck" ${failed ? "" : "disabled"}>✗ PhoneCheck Failed</button>
        <button class="btn ok" data-action="passPhonecheck" ${device.qcPhonecheck === "Pass" ? "" : "disabled"}>✓ PhoneCheck Passed — continue</button>
      </span>
    </div>`;
      }

      function physicalQcStepHtml(device) {
        return `
    <h2>Physical QC</h2>
    <p class="mut">Check the device by hand: battery temperature and cosmetic condition.</p>
    <p><b>${escapeHtml(device.brand)} ${escapeHtml(device.model)}</b> · ${escapeHtml(device.storage)} · <span class="mut">${escapeHtml(device.imei)}</span></p>
    <label>Battery — does the device feel hot?</label>
    ${optionButtonsHtml("qcBattery", QC_BATTERY_OPTIONS, device.qcBattery, "Overheating")}
    <label>Cosmetic grade</label>
    ${optionButtonsHtml("qcGrade", QC_GRADES, device.qcGrade, "", QC_GRADE_LABELS)}
    <label>Failure reason <span class="mut" style="font-weight:400">(only if the device fails)</span></label>
    <select id="qc-reason" style="width:100%">${reasonOptionsHtml(device.qcReason)}</select>
    <label>Physical QC notes <span class="mut" style="font-weight:400">(required if the reason is “Other”)</span></label>
    <textarea id="qc-note" placeholder="Optional details, e.g. where the damage is">${escapeHtml(device.qcNote)}</textarea>
    <div id="qc-message"></div>
    <div class="row">
      <button class="btn sec" data-action="goToStep" data-step="2">← Back to PhoneCheck</button>
      <span style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn dng" id="qc-fail" data-action="failQc" disabled>✗ Physical QC Failed</button>
        <button class="btn ok" id="qc-pass" data-action="passQc" disabled>✓ Physical QC Passed — continue</button>
      </span>
    </div>`;
      }

      // Updates the QC step's buttons without re-rendering, so typing is not interrupted.
      function updateQcForm() {
        const device = findOpenDevice();
        device.qcNote = $("qc-note").value;
        device.qcReason = $("qc-reason").value;
        $("qc-pass").disabled = !canPassQc(device);
        $("qc-fail").disabled = !canFailQc(device);
        $("qc-message").innerHTML =
          device.qcBattery === "Overheating"
            ? `<div class="msg e">A device with an overheating battery cannot pass Physical QC. Choose the failure reason above and press “Physical QC Failed”.</div>`
            : "";
        persist();
      }

      function wipeStepHtml(device) {
        return `
    <h2>Wipe the device in Apple Configurator</h2>
    <p class="mut">Do this outside this app. When the wipe has finished successfully, continue.</p>
    <div class="big">${escapeHtml(device.imei)}</div>
    <div class="row">
      <button class="btn sec" data-action="goToStep" data-step="3">← Back to Physical QC</button>
      <button class="btn" data-action="goToStep" data-step="5">Wipe finished →</button>
    </div>`;
      }

      function powerOffStepHtml() {
        return `
    <h2>Turn the device OFF</h2>
    <p class="mut">Hold the side button and power the iPhone completely off.</p>
    <div class="row">
      <button class="btn sec" data-action="goToStep" data-step="4">← Back</button>
      <button class="btn" data-action="goToStep" data-step="6">Device is off →</button>
    </div>`;
      }

      function verifyStepHtml(device) {
        const checkboxes = VERIFY_CHECKS.map(
          ({ key, label }) => `
    <label class="chk ${device.chk[key] ? "on" : ""}">
      <input type="checkbox" data-action="toggleCheck" data-check="${key}" ${device.chk[key] ? "checked" : ""}> ${label}
    </label>`,
        ).join("");
        return `
    <h2>Check the physical device</h2>
    <p class="mut">Compare what is printed on the iPhone with what you entered.</p>
    <p><b>${escapeHtml(device.brand)} ${escapeHtml(device.model)}</b> · ${escapeHtml(device.storage)}</p>
    <label>IMEI entered</label><div class="big">${escapeHtml(device.imei)}</div>
    <label>Serial entered</label><div class="big">${escapeHtml(device.serial)}</div>
    ${checkboxes}
    <div class="row">
      <button class="btn sec" data-action="goToStep" data-step="5">← Back</button>
      <button class="btn ok" data-action="completeDevice" ${isFullyVerified(device) ? "" : "disabled"}>Complete Device ✓</button>
    </div>`;
      }

      // Updates the identify step's messages and button without re-rendering,
      // so the operator's cursor stays in the field while typing.
      function updateIdentifyForm() {
        const device = findOpenDevice();
        const imeiInput = $("imei-input");
        const serialInput = $("serial-input");

        imeiInput.value = imeiInput.value.replace(/\D/g, "");
        device.imei = imeiInput.value;
        device.serial = serialInput.value;
        device.brand = $("brand-input").value;
        device.model = $("model-input").value;
        device.storage = $("storage-input").value;

        const imeiValid = device.imei.length === IMEI_LENGTH;
        const serialValid = hasText(device.serial);
        const detailsValid =
          hasText(device.brand) &&
          hasText(device.model) &&
          hasText(device.storage);
        const duplicate = imeiValid ? findDuplicate(device) : null;

        if (device.imei.length === 0) {
          $("imei-message").innerHTML = "";
        } else if (imeiValid) {
          $("imei-message").innerHTML =
            '<div class="msg g">✓ IMEI looks good</div>';
        } else {
          $("imei-message").innerHTML =
            `<div class="msg e">IMEI must be exactly ${IMEI_LENGTH} digits — you have entered ${device.imei.length}.</div>`;
        }

        $("serial-message").innerHTML =
          !serialValid && ui.serialTouched
            ? '<div class="msg e">Serial Number is required.</div>'
            : "";

        $("duplicate-warning").innerHTML = duplicate
          ? `
    <div class="msg w"><b>⚠ Duplicate IMEI!</b> Already recorded on ${duplicate.date} (${duplicate.status}).
      <label class="chk" style="font-size:16px;margin-top:8px">
        <input type="checkbox" id="duplicate-ok" style="width:22px;height:22px" ${ui.duplicateAcknowledged ? "checked" : ""}>
        This is intentional (re-processing)
      </label>
    </div>`
          : "";

        $("continue-button").disabled = !(
          imeiValid &&
          serialValid &&
          detailsValid &&
          (!duplicate || ui.duplicateAcknowledged)
        );
        persist();
      }

      function showDevice() {
        ui.screen = "device";
        ui.serialTouched = false;
        ui.duplicateAcknowledged = false;
        render();
      }

      /* ============================================================
   Actions (triggered by data-action attributes in the HTML)
   ============================================================ */
      const actions = {
        addDevice() {
          createDevice();
          showDevice();
        },
        resumeDevice: showDevice,
        backToList() {
          ui.screen = "home";
          removeBlankDevices();
          persist();
          render();
        },
        confirmIdentifiers() {
          const device = findOpenDevice();
          device.serial = device.serial.trim();
          device.brand = device.brand.trim();
          device.model = device.model.trim();
          device.storage = device.storage.trim();
          device.model = canonicalModel(device.model);
          device.step = 2;
          persist();
          render();
        },
        setQc(button) {
          const device = findOpenDevice();
          const { field, value } = button.dataset;
          if (!["qcPhonecheck", "qcBattery", "qcGrade"].includes(field)) return;
          device[field] = value;
          // Pre-fill the failure reason when it is obvious.
          if (
            field === "qcBattery" &&
            value === "Overheating" &&
            !device.qcReason
          )
            device.qcReason = "Overheating battery";
          persist();
          renderDeviceScreen();
        },
        passPhonecheck() {
          const device = findOpenDevice();
          if (device.qcPhonecheck !== "Pass") return;
          device.pcNote = "";
          device.step = 3;
          persist();
          showDevice();
        },
        // A PhoneCheck failure ends the device here; Physical QC is never reached.
        failPhonecheck() {
          const device = findOpenDevice();
          if (device.qcPhonecheck !== "Fail") return;
          const noteBox = $("pc-note");
          device.pcNote = noteBox ? noteBox.value.trim() : "";
          device.qcResult = "";
          device.qcGrade = "";
          device.qcBattery = "";
          device.qcReason = "";
          device.qcNote = "";
          finishDevice(device, STATUS.QC_FAILED);
        },
        passQc() {
          const device = findOpenDevice();
          if (!canPassQc(device)) return;
          device.qcNote = device.qcNote.trim();
          device.qcReason = "";
          device.qcResult = "Pass";
          device.step = 4;
          persist();
          showDevice();
        },
        failQc() {
          const device = findOpenDevice();
          device.qcNote = device.qcNote.trim();
          if (!canFailQc(device)) return;
          device.qcResult = "Fail";
          finishDevice(device, STATUS.QC_FAILED);
        },
        goToStep(button) {
          const device = findOpenDevice();
          device.step = Number(button.dataset.step);
          if (device.step < 6) device.chk = {};
          // Going back to Physical QC (or earlier) means it has to be passed again.
          if (device.step <= 3) device.qcResult = "";
          persist();
          showDevice();
        },
        toggleCheck(checkbox) {
          const device = findOpenDevice();
          device.chk[checkbox.dataset.check] = checkbox.checked;
          persist();
          renderDeviceScreen();
        },
        completeDevice() {
          const device = findOpenDevice();
          if (
            !isIdentified(device) ||
            device.qcResult !== "Pass" ||
            !isFullyVerified(device)
          )
            return;
          finishDevice(device, STATUS.COMPLETED);
        },
        openExceptionModal() {
          openModal(`
      <h2>Mark this device as an Exception</h2>
      <p class="mut">Describe the problem briefly (e.g. "stuck on setup screen"). This device will NOT count as completed.</p>
      <textarea id="exception-note" placeholder="What went wrong?"></textarea>
      <div class="row">
        <button class="btn sec" data-action="closeModal">Cancel</button>
        <button class="btn dng" id="save-exception" data-action="saveException" disabled>Save exception &amp; return to list</button>
      </div>`);
          $("exception-note").focus();
        },
        saveException() {
          const note = $("exception-note").value.trim();
          if (note) finishDevice(findOpenDevice(), STATUS.EXCEPTION, note);
        },
        closeModal,

        /* ----- Edit and delete ----- */
        openEditModal(button) {
          openEditModal(deviceAtIndex(button.dataset.index));
        },
        saveEdit() {
          if ($("save-edit").disabled) return;
          const device = ui.editing;
          device.imei = $("edit-imei").value;
          device.serial = $("edit-serial").value.trim();
          device.brand = $("edit-brand").value.trim();
          device.model = canonicalModel($("edit-model").value);
          device.storage = $("edit-storage").value.trim();
          if (device.status === STATUS.EXCEPTION)
            device.note = $("edit-note").value.trim();
          if (device.qcPhonecheck) {
            device.qcPhonecheck = $("edit-phonecheck").value;
            device.pcNote = $("edit-pcnote").value.trim();
          }
          if (device.qcResult) {
            device.qcGrade = $("edit-grade").value;
            device.qcBattery = $("edit-battery").value;
            device.qcReason = $("edit-reason").value;
            device.qcNote = $("edit-qcnote").value.trim();
          }
          persist();
          closeModal();
          showToast(`${deviceLabel(device)} updated`);
          render();
        },
        openDeleteModal(button) {
          openDeleteModal(deviceAtIndex(button.dataset.index));
        },
        openDeleteFinalModal() {
          openDeleteFinalModal();
        },
        deleteDevice() {
          const device = ui.deleting;
          state.records = state.records.filter((record) => record !== device);
          persist();
          closeModal();
          showToast(`${deviceLabel(device)} deleted`);
          render();
        },

        /* ----- Operator name ----- */
        changeName() {
          ui.changingName = true;
          render();
        },
        cancelChangeName() {
          ui.changingName = false;
          render();
        },
        // Saving a different name renames the operator on every existing record. Nothing is deleted.
        startSession() {
          const name = $("name-input").value.trim();
          if (!name) return;
          const oldName = state.operator;
          if (oldName && name !== oldName) {
            state.records.forEach((device) => {
              if (device.operator === oldName) device.operator = name;
            });
          }
          switchOperator(name);
        },

        /* ----- Exports and maintenance ----- */
        exportCsv,
        exportPdf,
        clearAllData() {
          if (
            prompt(
              "This deletes ALL saved devices in this browser. Type DELETE to confirm.",
            ) !== "DELETE"
          )
            return;
          state = {
            operator: state.operator,
            version: STATE_VERSION,
            records: [],
          };
          persist();
          render();
        },
      };

      function openEditModal(device) {
        ui.editing = device;
        const noteField =
          device.status === STATUS.EXCEPTION
            ? `<label>Exception note</label><textarea id="edit-note">${escapeHtml(device.note)}</textarea>`
            : "";
        const selectOptions = (options, selected) =>
          ['<option value="">—</option>']
            .concat(
              options.map(
                (option) =>
                  `<option ${option === selected ? "selected" : ""}>${option}</option>`,
              ),
            )
            .join("");
        const pcFields = device.qcPhonecheck
          ? `<label>PhoneCheck result</label><select id="edit-phonecheck">${selectOptions(QC_PHONECHECK_OPTIONS, device.qcPhonecheck)}</select>
    <label>PhoneCheck notes</label><textarea id="edit-pcnote">${escapeHtml(device.pcNote)}</textarea>`
          : "";
        const qcFields = device.qcResult
          ? `<label>Physical QC result</label><div><span class="tag ${device.qcResult === "Pass" ? "Completed" : "QC-Failed"}">${device.qcResult}</span></div>
    <label>Cosmetic grade</label><select id="edit-grade">${selectOptions(QC_GRADES, device.qcGrade)}</select>
    <label>Battery check</label><select id="edit-battery">${selectOptions(QC_BATTERY_OPTIONS, device.qcBattery)}</select>
    <label>Physical QC failure reason</label><select id="edit-reason">${selectOptions(QC_FAIL_REASONS, device.qcReason)}</select>
    <label>Physical QC notes</label><textarea id="edit-qcnote">${escapeHtml(device.qcNote)}</textarea>`
          : "";
        openModal(`
    <h2>Edit device</h2>
    <label>IMEI (15 digits)</label>
    <input type="text" id="edit-imei" inputmode="numeric" maxlength="${IMEI_LENGTH}" value="${escapeHtml(device.imei)}" autocomplete="off">
    <div id="edit-imei-message"></div>
    <label>Serial Number</label>
    <input type="text" id="edit-serial" value="${escapeHtml(device.serial)}" autocomplete="off">
    <label>Brand</label>
    <input type="text" class="txt" id="edit-brand" value="${escapeHtml(device.brand)}" autocomplete="off">
    <label>Model</label>
    <input type="text" class="txt" id="edit-model" list="model-options" value="${escapeHtml(device.model)}" autocomplete="off">
    ${modelDatalistHtml()}
    <label>Storage</label>
    <input type="text" class="txt" id="edit-storage" list="storage-options" value="${escapeHtml(device.storage)}" autocomplete="off">
    ${storageDatalistHtml()}
    ${noteField}
    ${pcFields}
    ${qcFields}
    <div class="row">
      <button class="btn sec" data-action="closeModal">Cancel</button>
      <button class="btn" id="save-edit" data-action="saveEdit">Save changes</button>
    </div>`);
        updateEditForm();
      }

      function updateEditForm() {
        const device = ui.editing;
        const imeiInput = $("edit-imei");
        imeiInput.value = imeiInput.value.replace(/\D/g, "");
        const imei = imeiInput.value;

        const imeiValid = imei.length === IMEI_LENGTH;
        const serialValid = $("edit-serial").value.trim() !== "";
        const noteValid =
          device.status !== STATUS.EXCEPTION ||
          $("edit-note").value.trim() !== "";
        const qcNoteValid =
          device.qcResult !== "Fail" ||
          canFailQc({
            qcReason: $("edit-reason").value,
            qcNote: $("edit-qcnote").value,
          }) ||
          (!$("edit-reason").value && $("edit-qcnote").value.trim() !== "");
        const duplicate = imeiValid
          ? state.records.find(
              (other) => other !== device && other.imei === imei,
            )
          : null;

        if (imei && !imeiValid) {
          $("edit-imei-message").innerHTML =
            `<div class="msg e">IMEI must be exactly ${IMEI_LENGTH} digits — you have entered ${imei.length}.</div>`;
        } else if (duplicate) {
          $("edit-imei-message").innerHTML =
            `<div class="msg w">⚠ This IMEI is already recorded on ${duplicate.date} (${duplicate.status}).</div>`;
        } else {
          $("edit-imei-message").innerHTML = "";
        }
        $("save-edit").disabled = !(
          imeiValid &&
          serialValid &&
          noteValid &&
          qcNoteValid
        );
      }

      // Deleting takes two confirmations: this first one, then a final "are you sure".
      function openDeleteModal(device) {
        ui.deleting = device;
        openModal(`
    <h2>Delete this device?</h2>
    <p>IMEI: <b>${escapeHtml(device.imei) || "—"}</b><br>Serial: <b>${escapeHtml(device.serial) || "—"}</b><br>Status: <b>${device.status}</b></p>
    <div class="row">
      <button class="btn sec" data-action="closeModal">Cancel</button>
      <button class="btn dng" data-action="openDeleteFinalModal">Delete…</button>
    </div>`);
      }

      function openDeleteFinalModal() {
        const device = ui.deleting;
        openModal(`
    <h2>Are you sure?</h2>
    <p>The device with IMEI <b>${escapeHtml(device.imei) || "—"}</b> will be permanently deleted. This cannot be undone.</p>
    <div class="row">
      <button class="btn sec" data-action="closeModal">No, keep it</button>
      <button class="btn dng" data-action="deleteDevice">Yes, delete permanently</button>
    </div>`);
      }

      function switchOperator(name) {
        if (name !== state.operator) ui.screen = "home";
        state.operator = name;
        ui.changingName = false;
        persist();
        render();
      }

      /* ============================================================
   Exports
   ============================================================ */
      function csvCell(value) {
        return `"${String(value ?? "").replace(/"/g, '""')}"`;
      }

      // Written as ="123" so Excel keeps long numbers as text instead of 3.5E+14.
      function csvTextCell(value) {
        return value ? csvCell(`="${value}"`) : csvCell("");
      }

      function exportCsv() {
        const header = [
          "IMEI",
          "Serial Number",
          "Brand",
          "Model",
          "Storage",
          "Operator",
          "Date",
          "Status",
          "PhoneCheck Result",
          "PhoneCheck Note",
          "Battery Check",
          "Cosmetic Grade",
          "Physical QC Result",
          "Physical QC Fail Reason",
          "Physical QC Note",
          "Exception Note",
        ];
        // Dates are written as text so Excel shows them as-is (no ########).
        const rows = devicesForExport().map((device) => [
          csvTextCell(device.imei),
          csvTextCell(device.serial),
          csvCell(device.brand),
          csvCell(device.model),
          csvCell(device.storage),
          csvCell(device.operator),
          csvTextCell(device.date),
          csvCell(device.status),
          csvCell(device.qcPhonecheck),
          csvCell(device.pcNote),
          csvCell(device.qcBattery),
          csvCell(device.qcGrade),
          csvCell(device.qcResult),
          csvCell(device.qcReason),
          csvCell(device.qcNote),
          csvCell(device.note),
        ]);
        const lines = [header.map(csvCell), ...rows].map((cells) =>
          cells.join(","),
        );

        const blob = new Blob(["\ufeff" + "sep=,\r\n" + lines.join("\r\n")], {
          type: "text/csv;charset=utf-8",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `devices-${state.operator.replace(/\W+/g, "-")}-${ui.date}.csv`;
        link.click();
      }

      /* ---------- PDF overview report ---------- */
      const PDF_COLORS = {
        ink: [29, 29, 31],
        mut: [110, 110, 115],
        line: [229, 229, 234],
        card: [240, 240, 244],
        blue: [0, 113, 227],
        green: [36, 138, 61],
        purple: [122, 47, 181],
        red: [215, 0, 21],
        amber: [200, 130, 0],
      };

      function percent(part, whole) {
        return whole ? Math.round((part / whole) * 100) : 0;
      }

      // Which part of QC a failed device failed at.
      function failedAt(device) {
        return device.qcPhonecheck === "Fail" ? "PhoneCheck" : "Physical QC";
      }

      function failureDetail(device) {
        if (device.qcPhonecheck === "Fail") return (device.pcNote || "").trim();
        return [device.qcReason, (device.qcNote || "").trim()]
          .filter(Boolean)
          .join(" - ");
      }

      function exportPdf() {
        const devices = devicesForExport();
        // If the PDF library could not load (e.g. offline), fall back to the print dialog.
        if (!window.jspdf || !window.jspdf.jsPDF) return printReport(devices);
        const doc = buildReportPdf(devices);
        doc.save(
          `device-report-${state.operator.replace(/\W+/g, "-")}-${ui.date}.pdf`,
        );
      }

      // Builds a multi-section overview: summary, QC breakdown, failures, models and device lists.
      // (Plain hyphens are used instead of fancy dashes: the built-in PDF font can't draw every symbol.)
      function buildReportPdf(devices) {
        const C = PDF_COLORS;
        const doc = new window.jspdf.jsPDF({
          orientation: "portrait",
          unit: "pt",
          format: "a4",
        });
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const M = 40;
        const contentW = pageW - M * 2;
        let y = 0;

        const completed = devices.filter((d) => d.status === STATUS.COMPLETED);
        const failed = devices.filter((d) => d.status === STATUS.QC_FAILED);
        const exceptions = devices.filter((d) => d.status === STATUS.EXCEPTION);
        const inProgress = devices.filter(
          (d) => d.status === STATUS.IN_PROGRESS,
        );
        const finished = completed.length + failed.length + exceptions.length;
        const count = (items, test) => items.filter(test).length;

        function ensureSpace(height) {
          if (y + height > pageH - 50) {
            doc.addPage();
            y = M;
          }
        }

        function heading(text) {
          ensureSpace(90);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(13);
          doc.setTextColor(...C.ink);
          doc.text(text, M, y);
          doc.setDrawColor(...C.line);
          doc.line(M, y + 6, M + contentW, y + 6);
          y += 24;
        }

        function caption(text) {
          doc.setFont("helvetica", "normal");
          doc.setFontSize(9);
          doc.setTextColor(...C.mut);
          doc.text(text, M, y);
          y += 14;
        }

        function table(head, body, options = {}) {
          if (!body.length) {
            caption("None.");
            y += 8;
            return;
          }
          doc.autoTable({
            startY: y,
            head: [head],
            body,
            margin: { left: M, right: M, top: M, bottom: 50 },
            styles: { fontSize: 8, cellPadding: 4, textColor: C.ink },
            headStyles: { fillColor: C.blue, textColor: 255 },
            alternateRowStyles: { fillColor: [247, 247, 250] },
            ...options,
          });
          y = doc.lastAutoTable.finalY + 22;
        }

        // A small labelled bar chart. Returns the height it used.
        function miniBars(x, top, width, title, rows) {
          doc.setFont("helvetica", "bold");
          doc.setFontSize(10);
          doc.setTextColor(...C.ink);
          doc.text(title, x, top);
          const total = rows.reduce((sum, row) => sum + row.value, 0);
          const labelW = 80;
          const barMax = width - labelW - 62;
          let rowY = top + 14;
          rows.forEach((row) => {
            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            doc.setTextColor(...C.mut);
            doc.text(row.label, x, rowY + 8);
            doc.setFillColor(...C.card);
            doc.roundedRect(x + labelW, rowY, barMax, 10, 3, 3, "F");
            const barW = total ? (row.value / total) * barMax : 0;
            if (barW > 0) {
              doc.setFillColor(...row.color);
              doc.rect(x + labelW, rowY, Math.max(barW, 2), 10, "F");
            }
            doc.setTextColor(...C.ink);
            doc.text(
              `${row.value} (${percent(row.value, total)}%)`,
              x + labelW + barMax + 6,
              rowY + 8,
            );
            rowY += 17;
          });
          return rowY - top;
        }

        function addFooters() {
          const pages = doc.getNumberOfPages();
          for (let page = 1; page <= pages; page++) {
            doc.setPage(page);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8);
            doc.setTextColor(...C.mut);
            doc.text(
              `Faro Device Wipe Tracker  |  ${state.operator}  |  ${ui.date}`,
              M,
              pageH - 24,
            );
            doc.text(`Page ${page} of ${pages}`, pageW - M, pageH - 24, {
              align: "right",
            });
          }
        }

        /* ----- Title band ----- */
        doc.setFillColor(...C.blue);
        doc.rect(0, 0, pageW, 78, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(20);
        doc.text("Device Wipe Report", M, 38);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text(
          `Faro Device Wipe Tracker  |  Date: ${ui.date}  |  Operator: ${state.operator}`,
          M,
          58,
        );
        y = 108;

        if (!devices.length) {
          caption("No devices were recorded for this day.");
          addFooters();
          return doc;
        }

        /* ----- Summary ----- */
        heading("Summary");
        const cards = [
          ["Total devices", devices.length, C.ink],
          ["Completed", completed.length, C.green],
          ["QC Failed", failed.length, C.purple],
          ["Exceptions", exceptions.length, C.red],
          ["In progress", inProgress.length, C.amber],
        ];
        const gap = 10;
        const cardW = (contentW - gap * 4) / 5;
        const cardH = 56;
        cards.forEach(([label, value, rgb], index) => {
          const x = M + index * (cardW + gap);
          doc.setFillColor(...C.card);
          doc.roundedRect(x, y, cardW, cardH, 8, 8, "F");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(22);
          doc.setTextColor(...rgb);
          doc.text(String(value), x + 12, y + 28);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8.5);
          doc.setTextColor(...C.mut);
          doc.text(label, x + 12, y + 44);
        });
        y += cardH + 16;

        // One bar showing how the day split between outcomes.
        let barX = M;
        [
          [completed.length, C.green],
          [failed.length, C.purple],
          [exceptions.length, C.red],
          [inProgress.length, C.amber],
        ].forEach(([amount, rgb]) => {
          const width = (amount / devices.length) * contentW;
          if (width > 0) {
            doc.setFillColor(...rgb);
            doc.rect(barX, y, width, 12, "F");
            barX += width;
          }
        });
        y += 28;
        caption(
          finished
            ? `Completion rate: ${percent(completed.length, finished)}% (${completed.length} of ${finished} finished devices).  QC fail rate: ${percent(failed.length, finished)}%.  Exception rate: ${percent(exceptions.length, finished)}%.`
            : "No devices have finished yet.",
        );
        y += 12;

        /* ----- QC overview ----- */
        heading("QC overview");
        caption(
          "Devices that fail PhoneCheck stop there and do not go on to Physical QC.",
        );
        y += 4;
        const phonecheckDevices = devices.filter((d) => d.qcPhonecheck);
        const physicalDevices = devices.filter((d) => d.qcResult);
        const batteryDevices = devices.filter((d) => d.qcBattery);
        const gradedDevices = devices.filter((d) => d.qcGrade);
        const colW = (contentW - 30) / 2;
        const colX = [M, M + colW + 30];

        ensureSpace(90);
        let heightLeft = miniBars(colX[0], y, colW, "PhoneCheck", [
          {
            label: "Pass",
            value: count(phonecheckDevices, (d) => d.qcPhonecheck === "Pass"),
            color: C.green,
          },
          {
            label: "Fail",
            value: count(phonecheckDevices, (d) => d.qcPhonecheck === "Fail"),
            color: C.purple,
          },
        ]);
        let heightRight = miniBars(colX[1], y, colW, "Physical QC", [
          {
            label: "Pass",
            value: count(physicalDevices, (d) => d.qcResult === "Pass"),
            color: C.green,
          },
          {
            label: "Fail",
            value: count(physicalDevices, (d) => d.qcResult === "Fail"),
            color: C.purple,
          },
        ]);
        y += Math.max(heightLeft, heightRight) + 14;

        ensureSpace(100);
        heightLeft = miniBars(colX[0], y, colW, "Battery check", [
          {
            label: "Normal",
            value: count(batteryDevices, (d) => d.qcBattery === "Normal"),
            color: C.green,
          },
          {
            label: "Overheating",
            value: count(batteryDevices, (d) => d.qcBattery === "Overheating"),
            color: C.red,
          },
        ]);
        heightRight = miniBars(colX[1], y, colW, "Cosmetic grade", [
          {
            label: "A - Excellent",
            value: count(gradedDevices, (d) => d.qcGrade === "A"),
            color: C.green,
          },
          {
            label: "B - Good",
            value: count(gradedDevices, (d) => d.qcGrade === "B"),
            color: C.blue,
          },
          {
            label: "C - Poor",
            value: count(gradedDevices, (d) => d.qcGrade === "C"),
            color: C.amber,
          },
        ]);
        y += Math.max(heightLeft, heightRight) + 14;

        /* ----- Failures by reason ----- */
        heading("QC failures by reason");
        const reasons = new Map();
        failed.forEach((device) => {
          const stage = failedAt(device);
          const reason =
            stage === "PhoneCheck"
              ? "Test failed"
              : device.qcReason || "No reason recorded";
          const key = `${stage}|${reason}`;
          if (!reasons.has(key)) reasons.set(key, { stage, reason, total: 0 });
          reasons.get(key).total += 1;
        });
        table(
          ["Failed at", "Reason", "Devices"],
          [...reasons.values()]
            .sort((a, b) => b.total - a.total)
            .map((r) => [r.stage, r.reason, r.total]),
        );

        /* ----- Models ----- */
        heading("Devices by model");
        const models = new Map();
        devices.forEach((device) => {
          const model = device.model || "-";
          const storageSize = device.storage || "-";
          const key = `${model}|${storageSize}`;
          if (!models.has(key))
            models.set(key, {
              model,
              storageSize,
              total: 0,
              completed: 0,
              failed: 0,
              exceptions: 0,
              inProgress: 0,
            });
          const group = models.get(key);
          group.total += 1;
          if (device.status === STATUS.COMPLETED) group.completed += 1;
          else if (device.status === STATUS.QC_FAILED) group.failed += 1;
          else if (device.status === STATUS.EXCEPTION) group.exceptions += 1;
          else group.inProgress += 1;
        });
        table(
          [
            "Model",
            "Storage",
            "Total",
            "Completed",
            "QC Failed",
            "Exceptions",
            "In progress",
          ],
          [...models.values()]
            .sort((a, b) => b.total - a.total || a.model.localeCompare(b.model))
            .map((g) => [
              g.model,
              g.storageSize,
              g.total,
              g.completed,
              g.failed,
              g.exceptions,
              g.inProgress,
            ]),
        );

        /* ----- Device lists ----- */
        const idColumns = {
          0: { cellWidth: "wrap" },
          1: { cellWidth: "wrap" },
        };

        heading("Completed devices");
        table(
          [
            "IMEI",
            "Serial",
            "Model",
            "Storage",
            "PhoneCheck",
            "Grade",
            "Battery",
          ],
          completed.map((d) => [
            d.imei || "-",
            d.serial || "-",
            d.model || "-",
            d.storage || "-",
            d.qcPhonecheck || "-",
            d.qcGrade || "-",
            d.qcBattery || "-",
          ]),
          { columnStyles: idColumns },
        );

        heading("QC failed devices");
        table(
          ["IMEI", "Serial", "Model", "Storage", "Failed at", "Details"],
          failed.map((d) => [
            d.imei || "-",
            d.serial || "-",
            d.model || "-",
            d.storage || "-",
            failedAt(d),
            failureDetail(d) || "-",
          ]),
          { columnStyles: idColumns },
        );

        heading("Exceptions");
        table(
          ["IMEI", "Serial", "Model", "Storage", "Note"],
          exceptions.map((d) => [
            d.imei || "-",
            d.serial || "-",
            d.model || "-",
            d.storage || "-",
            d.note || "-",
          ]),
          { columnStyles: idColumns },
        );

        if (inProgress.length) {
          heading("Still in progress");
          table(
            ["IMEI", "Serial", "Model", "Current step"],
            inProgress.map((d) => [
              d.imei || "-",
              d.serial || "-",
              d.model || "-",
              STEP_LABELS[d.step - 1] || "-",
            ]),
            { columnStyles: idColumns },
          );
        }

        addFooters();
        return doc;
      }

      // Fallback when the PDF library is unavailable: fills the hidden print-only report,
      // then opens the print dialog ("Save as PDF").
      function printReport(devices) {
        const rows = devices
          .map(
            (device) => `
    <tr><td>${escapeHtml(device.imei)}</td><td>${escapeHtml(device.serial)}</td>
        <td>${escapeHtml(device.brand)}</td><td>${escapeHtml(device.model)}</td><td>${escapeHtml(device.storage)}</td>
        <td>${escapeHtml(device.qcPhonecheck)}</td><td>${escapeHtml(device.qcResult)}</td><td>${escapeHtml(device.qcGrade)}</td><td>${escapeHtml(device.qcBattery)}</td>
        <td>${device.status}</td><td>${escapeHtml(noteText(device))}</td></tr>`,
          )
          .join("");

        $("report").innerHTML = `
    <h1 style="font-size:24px">Faro Device Wipe Tracker — Daily Report</h1>
    <p>Date: <b>${ui.date}</b><br>Operator: <b>${escapeHtml(state.operator)}</b><br>
       Total completed: <b>${countByStatus(devices, STATUS.COMPLETED)}</b> ·
       QC failed: <b>${countByStatus(devices, STATUS.QC_FAILED)}</b> ·
       Total exceptions: <b>${countByStatus(devices, STATUS.EXCEPTION)}</b> ·
       In progress: ${countByStatus(devices, STATUS.IN_PROGRESS)}</p>
    <table>
      <tr><th>IMEI</th><th>Serial</th><th>Brand</th><th>Model</th><th>Storage</th><th>PhoneCheck</th><th>Physical QC</th><th>Grade</th><th>Battery</th><th>Status</th><th>Note</th></tr>
      ${rows}
    </table>`;
        window.print();
      }

      /* ============================================================
   Event wiring
   ============================================================ */
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        if (target.tagName === "A") event.preventDefault();
        const action = actions[target.dataset.action];
        if (action) action(target);
      });

      document.addEventListener("input", (event) => {
        const { id, value } = event.target;
        if (id === "imei-input") {
          ui.duplicateAcknowledged = false;
          updateIdentifyForm();
        } else if (id === "serial-input") {
          ui.serialTouched = true;
          updateIdentifyForm();
        } else if (
          id === "brand-input" ||
          id === "model-input" ||
          id === "storage-input"
        ) {
          updateIdentifyForm();
        } else if (id === "name-input") {
          $("start-button").disabled = !value.trim();
        } else if (id === "search-input") {
          ui.search = value;
          $("device-rows").innerHTML = deviceRowsHtml();
        } else if (id === "pc-note") {
          findOpenDevice().pcNote = value;
          persist();
        } else if (id === "qc-note") {
          updateQcForm();
        } else if (id === "exception-note") {
          $("save-exception").disabled = !value.trim();
        } else if (
          id === "edit-imei" ||
          id === "edit-serial" ||
          id === "edit-note" ||
          id === "edit-qcnote"
        ) {
          updateEditForm();
        }
      });

      document.addEventListener("change", (event) => {
        const { id, checked, dataset, value } = event.target;
        if (id === "qc-reason") {
          updateQcForm();
        } else if (id === "edit-reason") {
          updateEditForm();
        } else if (id === "duplicate-ok") {
          ui.duplicateAcknowledged = checked;
          updateIdentifyForm();
        } else if (dataset.filter === "date") {
          ui.date = value;
          render();
        } else if (dataset.filter === "status") {
          ui.statusFilter = value;
          render();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        const { id } = event.target;
        const nextField = {
          "imei-input": "serial-input",
          "serial-input": "brand-input",
          "brand-input": "model-input",
          "model-input": "storage-input",
        };
        if (id === "name-input") actions.startSession();
        if (nextField[id]) $(nextField[id]).focus();
        if (id === "storage-input" && !$("continue-button").disabled)
          actions.confirmIdentifiers();
      });

      /* ============================================================
   Start
   ============================================================ */
      removeBlankDevices();
      render();
    </script>
  </body>
</html>
